name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build and verify without backend credentials
        run: |
          npm run build
          npm run lint
          npm test
          python -m unittest discover -s tests/hf_space
          npx playwright install --with-deps chromium
          npm run test:e2e -- --workers=1
          npm run test:account
          npm run test:production
      # Backend endpoints are baked into the bundle at build time.
      # Set these in: repo Settings → Secrets and variables → Actions → Secrets
      # Without them the deployed site runs in guest/demo mode.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HF_ENDPOINT: ${{ secrets.VITE_HF_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
